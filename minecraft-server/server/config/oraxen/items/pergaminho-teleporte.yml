# Pergaminho de Teleporte — item consumível.
# O EFEITO de teleporte (clique direito -> teleporta pro destino salvo, com
# cooldown) não é algo que o Oraxen resolve sozinho: precisa de um listener
# custom escutando o clique nesse item (checando o Oraxen ID) — módulo do
# PangeiaCore, bloco 5. Este arquivo só define a aparência/existência do item.
# Ver ../../../docs/itens-oraxen-valhalla.md

pergaminho_teleporte:
  displayname: '&bPergaminho de Teleporte'
  material: PAPER
  Pack:
    generate_model: true
    parent_model: item/generated
    custom_model_data: 16001
  lore:
    - '&7Clique com o botão direito para'
    - '&7se teleportar ao destino gravado.'
    - '&7Item consumido no uso.'
