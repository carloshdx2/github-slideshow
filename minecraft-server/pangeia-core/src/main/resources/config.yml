# PangeiaCore — configuração
#
# O conteúdo de cada mochila NÃO fica dentro do item: o item guarda só um
# UUID, e o conteúdo vive em plugins/PangeiaCore/mochilas/<uuid>.yml. Por
# isso copiar/duplicar o item não duplica o conteúdo — as cópias apontam
# para o mesmo armazenamento.

mochilas:
  autosave-segundos: 300

  # A textura vem do resource pack do Oraxen: declare no Oraxen um item com
  # o mesmo material + custom-model-data usado aqui (faixa 17000-17999 já
  # reservada para mochilas em docs/itens-oraxen-valhalla.md).
  #
  # O material-base precisa ser um item "inerte": nada de BUNDLE ou SHULKER_BOX,
  # que já têm armazenamento próprio no vanilla e brigariam com a mochila.
  tipos:
    mistica_simples:
      nome: '&5Mochila Mística Simples'
      material: LEATHER
      custom-model-data: 17001
      linhas: 1
      # Maldição do ligamento: a mochila não cai quando o jogador morre.
      ligamento: true
      # Místicas "são mais pesadas, então demoram para abrir".
      atraso-abertura-ticks: 40

    mistica_comum:
      nome: '&dMochila Mística Comum'
      material: LEATHER
      custom-model-data: 17002
      linhas: 2
      ligamento: false
      atraso-abertura-ticks: 20

    cargo_aurora:
      nome: '&bMochila de Cargo: Aurora'
      material: LEATHER
      custom-model-data: 17010
      linhas: 3
      # Só quem tem o cargo consegue abrir (permissão pangeia.cargo.aurora).
      cargo: aurora
      ligamento: false
      atraso-abertura-ticks: 0

    profissao_lenhador:
      nome: '&6Mochila de Lenhador'
      material: LEATHER
      custom-model-data: 17020
      linhas: 3
      # Só aceita itens da lista itens-por-profissao.lenhador.
      profissao: lenhador
      ligamento: false
      atraso-abertura-ticks: 0

    profissao_minerador:
      nome: '&7Mochila de Minerador'
      material: LEATHER
      custom-model-data: 17021
      linhas: 3
      profissao: minerador
      ligamento: false
      atraso-abertura-ticks: 0

    profissao_pescador:
      nome: '&9Mochila de Pescador'
      material: LEATHER
      custom-model-data: 17022
      linhas: 3
      profissao: pescador
      ligamento: false
      atraso-abertura-ticks: 0

    profissao_botanico:
      nome: '&aMochila de Botânico'
      material: LEATHER
      custom-model-data: 17023
      linhas: 3
      profissao: botanico
      ligamento: false
      atraso-abertura-ticks: 0

