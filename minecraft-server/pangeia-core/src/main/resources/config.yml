# Maldição do ligamento: itens que NÃO caem quando o jogador morre.
# Mochilas marcadas com "ligamento: true" já entram automaticamente.
ligamento:
  oraxen-ids:
    - pergaminho_teleporte
  materiais: []

# Renovação periódica do mundo de recursos (o mundo temporário de onde
# mineradores/lenhadores/botânicos extraem — ver docs/fundacao-permissoes.md).
#
# DESLIGADO por padrão de propósito: regenerar um mundo apaga tudo que há nele,
# e não tem desfazer. Só ligue depois de conferir o nome do mundo.
# O plugin se recusa a ligar se "mundo" for o mundo principal ou o de saída.
reset-mundo-recursos:
  ativado: false
  mundo: recursos_pangeia
  # Para onde os jogadores são levados antes da regeneração.
  mundo-de-saida: world
  intervalo-dias: 13
  avisos-minutos: [30, 10, 5, 1]
  # Quem regenera é o Multiverse; o plugin só dispara o comando no horário.
  comando-regenerar: 'mv regen %mundo% -s'

pergaminhos:
  # Tempo de conjuração antes do teleporte. Existe de propósito: teleporte
  # instantâneo viraria rota de fuga garantida em PvP.
  tempo-conjuracao-ticks: 60
  # O dano sofrido durante a conjuração cancela o teleporte.
  cancelar-ao-tomar-dano: true

  # Item de verdade do PangeiaCore — não depende de nenhum plugin de itens
  # customizados (Oraxen virou pago; ver docs/itens-oraxen-valhalla.md).
  # A "textura" por enquanto é o material vanilla puro; quando houver um
  # resource pack pronto, troque o material/custom-model-data aqui.
  tipos:
    pergaminho_teleporte:
      nome: '&bPergaminho de Teleporte'
      material: PAPER
      custom-model-data: 16001
      lore:
        - '&7Clique com o botão direito para'
        - '&7se teleportar ao destino gravado.'
        - '&7Item consumido no uso.'

  destinos:
    pergaminho_teleporte:
      mundo: world
      x: 0.5
      y: 70.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0

# Invocações (bloco 6). O clique direito no item chama/dispensa a
# "entidade" configurada, vinculada ao dono. Vitalidade, evolução, skins e
# aluguel ainda não existem — velocidade/pulo/vida abaixo são fixos, não
# evoluem. Ver docs/invocacoes-e-locomocao.md e docs/pangeia-core.md.
invocacoes:
  tipos:
    # Exemplo mínimo do esqueleto — não é um tipo de produção.
    elemental_lobo_teste:
      nome: '&fInvocação: Lobo'
      categoria: elemental
      entidade: WOLF
      material: BONE
      custom-model-data: 18001
      lore:
        - '&7Clique com o botão direito para'
        - '&7chamar ou dispensar a invocação.'

    # Primeira montaria terrestre "de verdade": atributos e aparência fixos
    # (sem isso cada chamada spawnaria um cavalo com stats/cor aleatórios do
    # vanilla, o que não combina com um mascote específico seu).
    montaria_cavalo_pangeia:
      nome: '&6Montaria: Corcel de Pangeia'
      categoria: terrestre
      entidade: HORSE
      material: SADDLE
      custom-model-data: 18101
      # Referência vanilla: velocidade 0.1–0.3, pulo 0.4–1.0, vida 15–30.
      velocidade: 0.225
      pulo: 0.7
      vida: 24.0
      cor-cavalo: CHESTNUT
      estilo-cavalo: NONE
      lore:
        - '&7Clique com o botão direito para'
        - '&7chamar ou dispensar a montaria.'

    # Primeira montaria voadora "de verdade". Nenhuma entidade vanilla é
    # montável E voadora ao mesmo tempo — o item concede voo de verdade ao
    # jogador (como criativo) e o fantasma vira uma escolta cosmética que
    # segue por perto, não um veículo. "velocidade" aqui vira a velocidade
    # de voo do jogador (fly speed), não um atributo da entidade.
    montaria_fantasma_pangeia:
      nome: '&5Montaria: Fantasma Etéreo'
      categoria: voadora
      entidade: PHANTOM
      material: FEATHER
      custom-model-data: 18201
      # fly speed vanilla vai de -1 a 1 (padrão do jogador é 0.1).
      velocidade: 0.2
      vida: 20.0
      lore:
        - '&7Clique com o botão direito para'
        - '&7voar (ou pousar dispensando a montaria).'
        - '&7Item delicado — use com carinho.'
