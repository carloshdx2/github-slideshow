name: PangeiaCore
version: '${project.version}'
main: io.github.carloshdx2.pangeia.PangeiaCore
api-version: '1.20'
author: carloshdx2
description: Mecânicas próprias do servidor Pangeia (mochilas, maldição do ligamento, pergaminhos).
softdepend: [Oraxen, LuckPerms]

commands:
  pangeia:
    description: Comandos administrativos do PangeiaCore.
    usage: /pangeia <mochila dar <jogador> <tipo>|reload>
    permission: pangeia.admin

permissions:
  pangeia.admin:
    description: Acesso aos comandos administrativos do PangeiaCore.
    default: op
